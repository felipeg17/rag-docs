name: submission-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, "dev", "ft-*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/submission-check.yml"

env:
  PYTHON_VERSION: "3.10.12"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  check-format-backend:
    name: Check backend code formatting
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Check backend formatting with ruff
        working-directory: ./backend
        run: uv run ruff format --check .

  check-format-frontend:
    name: Check frontend code formatting
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend_changed == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "frontend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: uv sync --all-extras

      - name: Check frontend formatting with ruff
        working-directory: ./frontend
        run: uv run ruff format --check .

  check-backend-typing:
    name: Check backend type hints
    runs-on: ubuntu-latest
    needs: [detect-changes, check-format-backend]
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Run mypy type checking on backend
        working-directory: ./backend
        run: uv run mypy app/ --config-file pyproject.toml

  backend-unit-tests:
    name: Run backend unit tests
    runs-on: ubuntu-latest
    needs: [detect-changes, check-backend-typing]
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Run backend unit tests
        working-directory: ./backend
        env:
          OPENAI_API_KEY: test-openai-key
          COHERE_API_KEY: test-cohere-key
          CHROMADB_HOST: localhost
          CHROMADB_PORT: 8000
          LANGCHAIN_PROJECT: rag-docs-test
          HOST: 0.0.0.0
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          working-directory: ./backend
          files: ./coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  check-secrets:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' || needs.detect-changes.outputs.frontend_changed == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
