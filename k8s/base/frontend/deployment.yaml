apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-docs-frontend
  labels:
    app: rag-docs-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-docs-frontend
  template:
    metadata:
      labels:
        app: rag-docs-frontend
    spec:
      containers:
        - name: frontend
          image: rag-docs-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8502
              name: http
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
